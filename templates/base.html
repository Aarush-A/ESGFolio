<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ESGFolio{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Dashboard.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    {% block head %}{% endblock %}
</head>

<body>
    <header>
        <div class="logo">
            <a href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='FinalLogo_edited.png') }}" alt="Logo">
            </a>
        </div>
        <div class="title">
            {% if session.get('username') %}
            {{ session['username'] }}'s <span class="green-text">ESG</span>Folio
            {% else %}
            <span class="green-text">ESG</span>Folio
            {% endif %}
        </div>
        {% if session.get('username') %}
        <a href="{{ url_for('logout') }}" class="logout">LOGOUT</a>
        {% else %}
        <!-- Optional: Login/Register buttons here if needed in header for non-logged-in pages, 
                 but per current design they are central on landing page. 
                 Leaving empty or ensuring layout doesn't break. -->
        {% endif %}
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>

</html>
